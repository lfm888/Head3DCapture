name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# 新提交进来时取消上一次排队/运行中的构建，少占 macOS runner 队列
concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      XCODEGEN_VERSION: "2.48.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      # 直接下预编译二进制并缓存，避免 `brew install xcodegen`（含 auto-update）每次都花 1~3 分钟
      - name: Cache XcodeGen
        id: xcodegen-cache
        uses: actions/cache@v4
        with:
          path: .xcodegen
          key: xcodegen-${{ env.XCODEGEN_VERSION }}

      - name: Install XcodeGen (prebuilt)
        if: steps.xcodegen-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .xcodegen
          curl -sSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d .xcodegen
          chmod +x .xcodegen/xcodegen/bin/xcodegen

      - name: Generate Xcode Project
        run: |
          .xcodegen/xcodegen/bin/xcodegen --version
          cat << 'EOF' > project.yml
          name: Head3DCapture
          options:
            bundleIdPrefix: com.head3d
            createIntermediateGroups: true
          targets:
            Head3DCapture:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.head3d.capture
                  INFOPLIST_FILE: Info.plist
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGNING_ALLOWED: NO
                  DEVELOPMENT_TEAM: ""
              dependencies:
                - sdk: Metal.framework
                - sdk: MetalKit.framework
          EOF
          .xcodegen/xcodegen/bin/xcodegen generate
          # Keep the hand-written Info.plist (camera usage + file sharing) intact.
          git diff --stat -- Info.plist || true

      - name: Build .app (Unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Head3DCapture.xcodeproj \
            -scheme Head3DCapture \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          echo "BUILD OK"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package into IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Head3DCapture.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Assets.car" && echo "Assets.car present"
          strings "$APP_PATH/Assets.car" | grep -c "AppIcon" || true
          rm -rf Payload Head3DCapture.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Head3DCapture.ipa Payload
          ls -lh Head3DCapture.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Head3DCapture-IPA
          path: Head3DCapture.ipa
          if-no-files-found: error
          retention-days: 30
